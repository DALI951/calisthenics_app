name: build-apk

# Builds the release APK entirely on GitHub (sitehub pattern):
#   EVERY push to main -> build + test + publish/UPDATE the v<version> Release.
# The release is deleted + recreated on each push, so the same download URL
# always points at the newest APK. Versioned from pubspec.yaml.
# No secrets in `if:` (invalid workflow file) — Firebase config is guarded in bash.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (freezed / json_serializable / riverpod)
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Firebase config (google-services.json from repo secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json injected ($(wc -c < android/app/google-services.json) bytes)"
          else
            echo "No GOOGLE_SERVICES_JSON secret set — building without Firebase config (backend-unavailable mode)."
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=prod

      - name: Publish/update GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          cp build/app/outputs/flutter-apk/app-release.apk "calisthenics_app-$VER.apk"
          gh release delete "$VER" --yes --repo "${{ github.repository }}" || true
          gh release create "$VER" "calisthenics_app-$VER.apk" \
            --repo "${{ github.repository }}" \
            --title "Calisthenics $VER" \
            --notes "Auto-built by GitHub Actions on every push. Sign in with email or Google; the workout program and 27-exercise library are inside." \
            --generate-notes