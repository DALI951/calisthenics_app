name: build-apk

# Builds the release APK entirely on GitHub (sitehub pattern):
#   EVERY push to main -> build + test + publish/UPDATE the v<version> Release.
# The release is deleted + recreated on each push, so the same download URL
# always points at the newest APK. Versioned from pubspec.yaml.
# No secrets in `if:` (invalid workflow file) — Firebase config is guarded in bash.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (freezed / json_serializable / riverpod)
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Set up Firebase config (google-services.json from repo secret)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            mkdir -p android/app
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
            echo "google-services.json injected ($(wc -c < android/app/google-services.json) bytes)"
          else
            echo "No GOOGLE_SERVICES_JSON secret set — building without Firebase config (backend-unavailable mode)."
          fi

      - name: Set up release signing key
        env:
          KEYSTORE_B64: ${{ secrets.CALISTHENICS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.CALISTHENICS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CALISTHENICS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CALISTHENICS_KEY_PASSWORD }}
        run: |
          # One stable keystore for every release. Without this the runner's
          # throwaway debug key signs each build and Android then refuses to
          # install the update over the previous one.
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::No CALISTHENICS_KEYSTORE_BASE64 secret — falling back to the debug key. Android will refuse to install this over the last release."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/calisthenics-release.jks
          cat > android/key.properties <<EOF
          CALISTHENICS_STORE_FILE=calisthenics-release.jks
          CALISTHENICS_STORE_PASSWORD=$STORE_PASSWORD
          CALISTHENICS_KEY_ALIAS=$KEY_ALIAS
          CALISTHENICS_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          sed -i 's/^          //' android/key.properties
          echo "Release signing key configured (alias $KEY_ALIAS)."

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=prod

      - name: Publish/update GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="v$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')"
          cp build/app/outputs/flutter-apk/app-release.apk "calisthenics_app-$VER.apk"
          gh release delete "$VER" --yes --repo "${{ github.repository }}" || true
          gh release create "$VER" "calisthenics_app-$VER.apk" \
            --repo "${{ github.repository }}" \
            --title "Calisthenics $VER" \
            --notes "Auto-built by GitHub Actions on every push. Sign in with email or Google; the workout program and 27-exercise library are inside." \
            --latest \
            --generate-notes

          # Public manifest for the in-app updater. The app reads this first, so
          # the check works without a GitHub token. Updating an existing file
          # through the contents API requires its current sha, else HTTP 422.
          RUN_ID="${{ github.run_id }}"
          MANIFEST_PATH="repos/${{ github.repository }}/contents/latest.json"
          MANIFEST_SHA=""
          if EXISTING_SHA=$(gh api "$MANIFEST_PATH" --jq .sha 2>/dev/null); then
            MANIFEST_SHA="$EXISTING_SHA"
          fi
          {
            echo '{'
            echo "  \"version\": \"$VER\","
            echo "  \"build\": \"$(grep -oP '(?<=^version: ).*' pubspec.yaml | cut -d+ -f2)\","
            echo "  \"apk\": \"https://github.com/${{ github.repository }}/releases/download/$VER/calisthenics_app-$VER.apk\","
            echo "  \"notes\": \"https://github.com/${{ github.repository }}/releases/tag/$VER\""
            echo '}'
          } > latest.json
          gh api "$MANIFEST_PATH" \
            --method PUT \
            --field message="chore: update manifest to $VER (run $RUN_ID)" \
            --field content="$(base64 -w0 latest.json)" \
            ${MANIFEST_SHA:+--field sha="$MANIFEST_SHA"} \
            --silent && echo "latest.json published for $VER"