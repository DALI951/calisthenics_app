name: build-apk

# Builds the release APK entirely on GitHub:
#   - pushes to main  -> build + test + APK artifact (best-effort upload)
#   - tag `v*`        -> build + test + APK published as a GitHub Release asset
#
# Release assets use release storage (separate from the artifact quota), so
# the APK always lands in Releases even when artifact storage is exhausted.
# No secrets needed: Firebase is initialized programmatically and the
# google-services plugin applies only when google-services.json exists.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (freezed / json_serializable / riverpod)
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=prod

      - name: Publish APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          APK="calisthenics_app-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --repo "$GITHUB_REPOSITORY" --generate-notes
          fi

      - name: Upload APK artifact (non-tag builds, best-effort)
        if: ${{ ! startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: calisthenics-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error