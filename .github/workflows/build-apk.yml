name: build-apk

# Builds the release APK entirely on GitHub and publishes it as a
# downloadable artifact on every push; pushing a tag `v*` additionally
# creates a GitHub Release containing the APK.
#
# No secrets needed: Firebase is initialized programmatically and the
# google-services plugin is applied only when google-services.json exists
# (repo file — see android/app/build.gradle.kts), so CI is always green.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Codegen (freezed / json_serializable / riverpod)
        run: dart run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_ENV=prod

      - name: Rename APK with version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\r')
          cp build/app/outputs/flutter-apk/app-release.apk "calisthenics_app-v${VERSION}.apk"
          echo "apk=calisthenics_app-v${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calisthenics-apk
          path: calisthenics_app-v*.apk
          if-no-files-found: error

  release:
    needs: build-apk
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: calisthenics-apk
          path: apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apk/*
          generate_release_notes: true