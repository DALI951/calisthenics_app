name: calisthenics_app
description: "Calisthenics — a premium beginner-friendly calisthenics training app for two friends who train together, compete through healthy challenges, and improve over time."
publish_to: 'none'
version: 0.1.18+1

environment:
  sdk: ^3.13.4

# Runtime dependencies. Every package earns its place — see README dependency table.
dependencies:
  cloud_firestore: ^6.10.0
  connectivity_plus: ^7.3.1
  firebase_app_check: ^0.4.8
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_database: ^12.6.0
  firebase_storage: ^13.6.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_sign_in: ^7.2.0
  http: 1.2.2
  intl: ^0.20.3
  json_annotation: ^4.12.0
  package_info_plus: 8.1.0
  path_provider: 2.1.5
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  url_launcher: 6.3.1
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  freezed: ^4.0.2
  integration_test:
    sdk: flutter
  json_serializable: ^6.14.1
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# App launcher icons (regenerate after editing assets/icon/*.png):
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24